name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Offline tests (no API credentials or GPU)
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q app.py backend.py compare.py jev_backend.py providers.py settings.py plugins tests
      - name: Browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/compare.js
          node --check static/draw.js
