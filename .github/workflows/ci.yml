name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Offline tests (no API credentials or GPU)
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q app.py backend.py compare.py jev_backend.py providers.py settings.py plugins tests
      - name: Browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/compare.js
          node --check static/draw.js
